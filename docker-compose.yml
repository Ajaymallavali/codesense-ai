services:
  postgres:
    image: postgres:16-alpine
    container_name: codesense-postgres
    environment:
      POSTGRES_DB: codesense
      POSTGRES_USER: codesense
      POSTGRES_PASSWORD: codesense
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesense -d codesense"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codesense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/ai-service.Dockerfile
    container_name: codesense-ai-service
    environment:
      CODESENSE_ENV: development
      LLM_PROVIDER: ${LLM_PROVIDER:-cloudflare}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_MODEL: ${CLOUDFLARE_MODEL:-@cf/qwen/qwen2.5-coder-32b-instruct}
      CLOUDFLARE_TIMEOUT: ${CLOUDFLARE_TIMEOUT:-120}
      CLOUDFLARE_MAX_RETRIES: ${CLOUDFLARE_MAX_RETRIES:-2}
      CLOUDFLARE_MAX_OUTPUT_TOKENS: ${CLOUDFLARE_MAX_OUTPUT_TOKENS:-1500}
      QWEN_MODEL: ${QWEN_MODEL:-Qwen/Qwen3-Coder-Next}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_TIMEOUT: ${QWEN_TIMEOUT:-120}
      QWEN_MAX_RETRIES: ${QWEN_MAX_RETRIES:-2}
      QWEN_MAX_OUTPUT_TOKENS: ${QWEN_MAX_OUTPUT_TOKENS:-1500}
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: codesense-backend
    environment:
      CODESENSE_DATABASE_URL: postgresql://codesense:codesense@postgres:5432/codesense
      CODESENSE_AI_SERVICE_URL: http://ai-service:8000
      CODESENSE_REDIS_URL: redis://redis:6379/0
      CODESENSE_JWT_SECRET: local-dev-secret-change-before-production-please
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: codesense-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8050/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
