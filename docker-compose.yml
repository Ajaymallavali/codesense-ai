services:
  postgres:
    image: postgres:16-alpine
    container_name: codesense-postgres
    environment:
      POSTGRES_DB: codesense
      POSTGRES_USER: codesense
      POSTGRES_PASSWORD: codesense
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesense -d codesense"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codesense-redis
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/ai-service.Dockerfile
    container_name: codesense-ai-service
    environment:
      CODESENSE_ENV: development
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: codesense-backend
    environment:
      CODESENSE_DATABASE_URL: postgresql://codesense:codesense@postgres:5432/codesense
      CODESENSE_AI_SERVICE_URL: http://ai-service:8000
      CODESENSE_REDIS_URL: redis://redis:6379/0
      CODESENSE_JWT_SECRET: local-dev-secret-change-before-production-please
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: codesense-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8050/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
